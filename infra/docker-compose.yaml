version: '3.8'

services:
  kafka1:
    image: confluentinc/cp-kafka:7.8.6
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'kafka'
      KAFKA_NODE_ID: '1'
    

      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"   #controllers communicate on port 9093host hwa kafka w
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/kraft-combined-logs
    volumes:
      - kafka1_kraft:/var/lib/kafka/data
    networks:
      - SentinelNetwork
  kafka2:
    image: confluentinc/cp-kafka:7.8.6
    container_name: kafka2
    ports:
      - "9094:9092"
      - "9095:9093"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'kafka'
      KAFKA_NODE_ID: '2'

      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"  
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/kraft-combined-logs
    volumes:
      - kafka2_kraft:/var/lib/kafka/data
    networks:
      - SentinelNetwork
  kafka3:
    image: confluentinc/cp-kafka:7.8.6
    container_name: kafka3
    ports:
      - "9096:9092"
      - "9097:9093"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'kafka'
      KAFKA_NODE_ID: '3'

      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"  
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/kraft-combined-logs
    volumes:
      - kafka3_kraft:/var/lib/kafka/data
    networks:
      - SentinelNetwork
    

volumes:
  kafka1_kraft:
  kafka2_kraft:
  kafka3_kraft:
networks:
  SentinelNetwork:
    driver: bridge